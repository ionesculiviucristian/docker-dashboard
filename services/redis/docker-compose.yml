networks:
  nginx-proxy:
    external: true
    name: "${NGINX_PROXY_NETWORK:?err}"
  prometheus:
    external: true
    name: "${PROMETHEUS_NETWORK:?err}"
  redis:
    external: true
    name: "${REDIS_NETWORK:?err}"
services:
  redis:
    command: "redis-server --appendonly yes --save 60 1 --requirepass ${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?err}"
      TZ: "${TZ:?err}"
    image: "redis:${REDIS_VERSION:?err}"
    labels:
      wud.tag.include: "^\\d+\\.\\d+-alpine$$"
      wud.watch: true
    networks:
      - "redis"
    restart: "unless-stopped"
    volumes:
      - "redis-data:/data"
  redis-prometheus-exporter:
    environment:
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?err}"
      REDIS_USER: null
      TZ: "${TZ:?err}"
    image: "oliver006/redis_exporter:${REDIS_EXPORTER_VERSION:?err}"
    labels:
      wud.tag.include: "^v\\d+\\.\\d+\\.\\d+-alpine$$"
      wud.watch: true
    networks:
      - "prometheus"
      - "redis"
    restart: "unless-stopped"
  redis-redisinsight:
    environment:
      TZ: "${TZ:?err}"
      VIRTUAL_HOST: "${REDIS_VIRTUAL_HOST:?err}"
      VIRTUAL_PORT: "${REDIS_VIRTUAL_PORT:?err}"
    image: "redis/redisinsight:${REDIS_REDISINSIGHT_VERSION:?err}"
    labels:
      wud.tag.include: "^\\d+\\.\\d+$$"
      wud.watch: true
    networks:
      - "nginx-proxy"
      - "redis"
    restart: "unless-stopped"
    volumes:
      - "redis-redisinsight-data:/data"
volumes:
  redis-data: null
  redis-redisinsight-data: null
