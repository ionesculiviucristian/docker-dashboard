        href: "https://{{HOMEPAGE_VAR_OPEN_WEBUI_HOSTNAME}}/"
        icon: "sh-open-webui.png"
        server: "my-docker"
        showStats: true
    - RabbitMQ:
        container: "{{HOMEPAGE_VAR_COMPOSE_PROJECT_NAME}}-rabbitmq-1"
        description: "RabbitMQ is a reliable and mature messaging and streaming broker, which is easy to deploy on cloud environments, on-premises, and on your local machine"
        href: "https://{{HOMEPAGE_VAR_RABBITMQ_HOSTNAME}}/"
        icon: "sh-rabbitmq.png"
        server: "my-docker"
        showStats: true
    - Redis Insight:
        container: "{{HOMEPAGE_VAR_COMPOSE_PROJECT_NAME}}-redis-redisinsight-1"
        description: "Redis Insight is a powerful tool for visualizing and optimizing data in Redis or Redis Stack, making real-time application development easier and more fun than ever before"
        href: "https://{{HOMEPAGE_VAR_REDIS_HOSTNAME}}/"
        icon: "/icons/redisinsight.png"
        server: "my-docker"
        showStats: true
    - seaweedFS:
        container: "{{HOMEPAGE_VAR_COMPOSE_PROJECT_NAME}}-seaweedfs-1"
        description: "Enterprise-Grade Distributed Storage with Self-Healing"
        href: "https://{{HOMEPAGE_VAR_SEAWEEDFS_HOSTNAME}}/"
        icon: "sh-seaweedfs.png"
        server: "my-docker"
        showStats: true
    - Traefik:
        container: "{{HOMEPAGE_VAR_COMPOSE_PROJECT_NAME}}-traefik-1"
        description: "Traefik is a leading modern open source reverse proxy and ingress controller that makes deploying services and APIs easy"
        href: "https://{{HOMEPAGE_VAR_TRAEFIK_HOSTNAME}}/"
        icon: "sh-traefik.png"
        server: "my-docker"
        showStats: true
        widget:
          type: "traefik"
