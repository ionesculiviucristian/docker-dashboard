networks:
  nginx-proxy:
    external: true
    name: "${NGINX_PROXY_NETWORK:?err}"
  postgres:
    external: true
    name: "${POSTGRES_NETWORK:?err}"
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_USER_PASSWORD:?err}"
      POSTGRES_USER: "${POSTGRES_USER:?err}"
      POSTGRES_EXPORTER_PASSWORD: "${POSTGRES_EXPORTER_USER_PASSWORD:?err}"
      POSTGRES_EXPORTER_USER: "${POSTGRES_EXPORTER_USER:?err}"
      TZ: "${TZ:?err}"
    healthcheck:
      interval: "30s"
      retries: 5
      start_period: "60s"
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      timeout: "10s"
    image: "postgres:${POSTGRES_VERSION:?err}"
    labels:
      wud.tag.include: "^\\d+\\.\\d+$$"
      wud.watch: true
    networks:
      - "postgres"
    restart: "unless-stopped"
    shm_size: "256m"
    volumes:
      - "${PWD}/services/postgres/postgres/initdb:/docker-entrypoint-initdb.d:ro"
      - "postgres-data:/var/lib/postgresql/data"
  postgres-pgadmin4:
    depends_on:
      - "postgres"
    environment:
      PGADMIN_DEFAULT_EMAIL: "${POSTGRES_PGADMIN4_PGADMIN_DEFAULT_EMAIL:?err}"
      PGADMIN_DEFAULT_PASSWORD: "${POSTGRES_PGADMIN4_PGADMIN_DEFAULT_PASSWORD:?err}"
      TZ: "${TZ:?err}"
      VIRTUAL_HOST: "${POSTGRES_PGADMIN4_VIRTUAL_HOST:?err}"
    image: "dpage/pgadmin4:${POSTGRES_PGADMIN4_PGADMIN_VERSION:?err}"
    labels:
      wud.tag.include: "^\\d+\\.\\d+$$"
      wud.watch: true
    networks:
      - "nginx-proxy"
      - "postgres"
    restart: "unless-stopped"
    volumes:
      - "${PWD}/services/postgres/pgadmin4/preferences.json:/pgadmin4/preferences.json:ro"
      - "${PWD}/services/postgres/pgadmin4/servers.json:/pgadmin4/servers.json:ro"
      - "postgres-pgadmin4-data:/var/lib/pgadmin"
  postgres-prometheus-exporter:
    depends_on:
      - "postgres"
    environment:
      DATA_SOURCE_PASS: "${POSTGRES_EXPORTER_USER_PASSWORD:?err}"
      DATA_SOURCE_URI: "postgres:5432/postgres?sslmode=disable"
      DATA_SOURCE_USER: "${POSTGRES_EXPORTER_USER:?err}"
      TZ: "${TZ:?err}"
    image: "prometheuscommunity/postgres-exporter:${POSTGRES_PROMETHEUS_EXPORTER_VERSION:?err}"
    labels:
      wud.tag.include: "^v\\d+\\.\\d+\\.\\d+$$"
      wud.watch: true
    networks:
      - "postgres"
      - "prometheus"
    restart: "unless-stopped"
volumes:
  postgres-data: null
  postgres-pgadmin4-data: null
