networks:
  postgres:
    external: true
    name: "${POSTGRES_NETWORK:?err}"
  prometheus:
    external: true
    name: "${PROMETHEUS_NETWORK:?err}"
  proxy:
    external: true
    name: "${PROXY_NETWORK:?err}"
services:
  postgres:
    environment:
      POSTGRES_EXPORTER_USER: "${POSTGRES_EXPORTER_USER:?err}"
      POSTGRES_EXPORTER_USER_PASSWORD: "${POSTGRES_EXPORTER_USER_PASSWORD:?err}"
      POSTGRES_PASSWORD: "${POSTGRES_USER_PASSWORD:?err}"
      POSTGRES_USER: "${POSTGRES_USER:?err}"
    healthcheck:
      interval: "30s"
      retries: 5
      start_period: "60s"
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_USER}"
      timeout: "10s"
    image: "postgres:${POSTGRES_VERSION:?err}"
    labels:
      wud.tag.include: "^\\d+\\.\\d+$$"
      wud.watch: true
    networks:
      - "postgres"
    restart: "unless-stopped"
    security_opt:
      - "no-new-privileges:true"
    shm_size: "256m"
    volumes:
      - "${PWD}/services/postgres/postgres/initdb:/docker-entrypoint-initdb.d:ro"
      - "postgres-data:/var/lib/postgresql"
  postgres-pgadmin4:
    depends_on:
      postgres:
        condition: "service_healthy"
    environment:
      PGADMIN_DEFAULT_EMAIL: "${POSTGRES_PGADMIN4_DEFAULT_EMAIL:?err}"
      PGADMIN_DEFAULT_PASSWORD: "${POSTGRES_PGADMIN4_DEFAULT_PASSWORD:?err}"
      PGADMIN_LISTEN_ADDRESS: "0.0.0.0"
    healthcheck:
      interval: "30s"
      retries: 5
      start_period: "60s"
      test:
        - "CMD-SHELL"
        - "wget --no-verbose --tries=1 --spider http://localhost/misc/ping || exit 1"
      timeout: "10s"
    image: "dpage/pgadmin4:${POSTGRES_PGADMIN4_VERSION:?err}"
    labels:
      traefik.docker.network: "${PROXY_NETWORK:?err}"
      traefik.enable: true
      traefik.http.routers.postgres-pgadmin4.entrypoints: "websecure"
      traefik.http.routers.postgres-pgadmin4.rule: "Host(`${POSTGRES_PGADMIN4_HOST:?err}`)"
      traefik.http.routers.postgres-pgadmin4.tls: true
      traefik.http.services.postgres-pgadmin4.loadbalancer.server.port: "${POSTGRES_PGADMIN4_HOST_PORT:?err}"
      wud.tag.include: "^\\d+\\.\\d+$$"
      wud.watch: true
    networks:
      - "postgres"
      - "proxy"
    restart: "unless-stopped"
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - "${PWD}/services/postgres/pgadmin4/preferences.json:/pgadmin4/preferences.json:ro"
      - "${PWD}/services/postgres/pgadmin4/servers.json:/pgadmin4/servers.json:ro"
      - "postgres-pgadmin4-data:/var/lib/pgadmin"
  postgres-prometheus-exporter:
    depends_on:
      postgres:
        condition: "service_healthy"
    environment:
      DATA_SOURCE_PASS: "${POSTGRES_EXPORTER_USER_PASSWORD:?err}"
      DATA_SOURCE_URI: "postgres:5432/postgres?sslmode=disable"
      DATA_SOURCE_USER: "${POSTGRES_EXPORTER_USER:?err}"
    healthcheck:
      interval: "30s"
      retries: 5
      start_period: "60s"
      test:
        - "CMD-SHELL"
        - "wget --no-verbose --tries=1 --spider http://localhost:9187/metrics || exit 1"
      timeout: "10s"
    image: "prometheuscommunity/postgres-exporter:${POSTGRES_PROMETHEUS_EXPORTER_VERSION:?err}"
    labels:
      wud.tag.include: "^v\\d+\\.\\d+\\.\\d+$$"
      wud.watch: true
    networks:
      - "postgres"
      - "prometheus"
    restart: "unless-stopped"
    security_opt:
      - "no-new-privileges:true"
volumes:
  postgres-data: null
  postgres-pgadmin4-data: null
