networks:
  authentik:
    external: true
    name: "${AUTHENTIK_NETWORK:?err}"
  postgres:
    external: true
    name: "${POSTGRES_NETWORK:?err}"
  prometheus:
    external: true
    name: "${PROMETHEUS_NETWORK:?err}"
  proxy:
    external: true
    name: "${PROXY_NETWORK:?err}"
services:
  authentik-server:
    command: "server"
    environment:
      AUTHENTIK_BOOTSTRAP_EMAIL: "${AUTHENTIK_BOOTSTRAP_EMAIL:?err}"
      AUTHENTIK_BOOTSTRAP_PASSWORD: "${AUTHENTIK_BOOTSTRAP_PASSWORD:?err}"
      AUTHENTIK_BOOTSTRAP_TOKEN: "${AUTHENTIK_BOOTSTRAP_TOKEN:?err}"
      AUTHENTIK_POSTGRESQL__HOST: "postgres"
      AUTHENTIK_POSTGRESQL__NAME: "${AUTHENTIK_POSTGRES_DB:?err}"
      AUTHENTIK_POSTGRESQL__PASSWORD: "${AUTHENTIK_POSTGRES_USER_PASSWORD:?err}"
      AUTHENTIK_POSTGRESQL__USER: "${AUTHENTIK_POSTGRES_USER:?err}"
      AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY:?err}"
    image: "ghcr.io/goauthentik/server:${AUTHENTIK_VERSION:?err}"
    labels:
      traefik.docker.network: "${PROXY_NETWORK:?err}"
      traefik.enable: true
      traefik.http.middlewares.authentik-server.forwardAuth.address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
      traefik.http.middlewares.authentik-server.forwardAuth.authResponseHeaders: "X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid,X-authentik-jwt,X-authentik-meta-jwks,X-authentik-meta-outpost,X-authentik-meta-provider,X-authentik-meta-app,X-authentik-meta-version"
      traefik.http.middlewares.authentik-server.forwardAuth.trustForwardHeader: true
      traefik.http.routers.authentik-server.entrypoints: "websecure"
      traefik.http.routers.authentik-server.rule: "Host(`${AUTHENTIK_HOSTNAME:?err}`)"
      traefik.http.routers.authentik-server.tls: true
      traefik.http.services.authentik-server.loadbalancer.server.port: "${AUTHENTIK_HOSTNAME_PORT:?err}"
      wud.tag.include: "^\\d+\\.\\d+\\.\\d+$$"
      wud.watch: true
    networks:
      - "authentik"
      - "postgres"
      - "prometheus"
      - "proxy"
    restart: "unless-stopped"
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - "authentik-data:/data"
      - "authentik-templates:/templates"
  authentik-worker:
    command: "worker"
    environment:
      AUTHENTIK_BOOTSTRAP_EMAIL: "${AUTHENTIK_BOOTSTRAP_EMAIL:?err}"
      AUTHENTIK_BOOTSTRAP_PASSWORD: "${AUTHENTIK_BOOTSTRAP_PASSWORD:?err}"
      AUTHENTIK_BOOTSTRAP_TOKEN: "${AUTHENTIK_BOOTSTRAP_TOKEN:?err}"
      AUTHENTIK_POSTGRESQL__HOST: "postgres"
      AUTHENTIK_POSTGRESQL__NAME: "${AUTHENTIK_POSTGRES_DB:?err}"
      AUTHENTIK_POSTGRESQL__PASSWORD: "${AUTHENTIK_POSTGRES_USER_PASSWORD:?err}"
      AUTHENTIK_POSTGRESQL__USER: "${AUTHENTIK_POSTGRES_USER:?err}"
      AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY:?err}"
    image: "ghcr.io/goauthentik/server:${AUTHENTIK_VERSION:?err}"
    labels:
      wud.tag.include: "^\\d+\\.\\d+\\.\\d+$$"
      wud.watch: true
    networks:
      - "authentik"
      - "postgres"
    restart: "unless-stopped"
    security_opt:
      - "no-new-privileges:true"
    user: "root"
    volumes:
      - "${PWD}/services/authentik/blueprints/traefik.yaml:/blueprints/traefik.yaml:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "authentik-certs:/certs"
      - "authentik-data:/data"
      - "authentik-templates:/templates"
volumes:
  authentik-certs: null
  authentik-data: null
  authentik-templates: null
