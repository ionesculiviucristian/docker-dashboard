networks:
  authentik:
    external: true
    name: "${AUTHENTIK_NETWORK:?err}"
  prometheus:
    external: true
    name: "${PROMETHEUS_NETWORK:?err}"
  proxy:
    external: true
    name: "${PROXY_NETWORK:?err}"
services:
  authentik-postgres:
    environment:
      POSTGRES_DB: "${AUTHENTIK_POSTGRES_DB:?err}"
      POSTGRES_PASSWORD: "${AUTHENTIK_POSTGRES_USER_PASSWORD:?err}"
      POSTGRES_USER: "${AUTHENTIK_POSTGRES_USER:?err}"
    healthcheck:
      interval: "30s"
      retries: 5
      start_period: "60s"
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${AUTHENTIK_POSTGRES_USER}"
      timeout: "10s"
    image: "postgres:${AUTHENTIK_POSTGRES_VERSION:?err}"
    labels:
      wud.tag.include: "^\\d+\\.\\d+$$"
      wud.watch: true
    networks:
      - "authentik"
    restart: "unless-stopped"
    security_opt:
      - "no-new-privileges:true"
    shm_size: "256m"
    volumes:
      - "authentik-postgres-data:/var/lib/postgresql"
  authentik-server:
    command: "server"
    depends_on:
      authentik-postgres:
        condition: "service_healthy"
    environment:
      AUTHENTIK_BOOTSTRAP_EMAIL: "${AUTHENTIK_BOOTSTRAP_EMAIL:?err}"
      AUTHENTIK_BOOTSTRAP_PASSWORD: "${AUTHENTIK_BOOTSTRAP_PASSWORD:?err}"
      AUTHENTIK_POSTGRESQL__HOST: "authentik-postgres"
      AUTHENTIK_POSTGRESQL__NAME: "${AUTHENTIK_POSTGRES_DB:?err}"
      AUTHENTIK_POSTGRESQL__PASSWORD: "${AUTHENTIK_POSTGRES_USER_PASSWORD:?err}"
      AUTHENTIK_POSTGRESQL__USER: "${AUTHENTIK_POSTGRES_USER:?err}"
      AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY:?err}"
      VIRTUAL_HOST: "${AUTHENTIK_VIRTUAL_HOST:?err}"
      VIRTUAL_PORT: "${AUTHENTIK_VIRTUAL_PORT:?err}"
    healthcheck:
      interval: "30s"
      retries: 5
      start_period: "90s"
      test:
        - "CMD-SHELL"
        - "curl --fail --silent --show-error http://localhost:9000/-/health/ready/ || exit 1"
      timeout: "10s"
    image: "authentik/server:${AUTHENTIK_VERSION:?err}"
    labels:
      traefik.docker.network: "${PROXY_NETWORK:?err}"
      traefik.enable: true
      traefik.http.middlewares.authentik-server.forwardAuth.address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
      traefik.http.middlewares.authentik-server.forwardAuth.authResponseHeaders: "X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid,X-authentik-jwt,X-authentik-meta-jwks,X-authentik-meta-outpost,X-authentik-meta-provider,X-authentik-meta-app,X-authentik-meta-version"
      traefik.http.middlewares.authentik-server.forwardAuth.trustForwardHeader: true
      traefik.http.routers.authentik-server.entrypoints: "websecure"
      traefik.http.routers.authentik-server.rule: "Host(`${AUTHENTIK_VIRTUAL_HOST:?err}`)"
      traefik.http.routers.authentik-server.tls: true
      traefik.http.services.authentik-server.loadbalancer.server.port: "${AUTHENTIK_VIRTUAL_PORT:?err}"
      wud.tag.include: "^\\d+\\.\\d+\\.\\d+$$"
      wud.watch: true
    networks:
      - "authentik"
      - "prometheus"
      - "proxy"
    restart: "unless-stopped"
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - "authentik-media:/media"
      - "authentik-templates:/templates"
  authentik-worker:
    command: "worker"
    depends_on:
      authentik-postgres:
        condition: "service_healthy"
    environment:
      AUTHENTIK_BOOTSTRAP_EMAIL: "${AUTHENTIK_BOOTSTRAP_EMAIL:?err}"
      AUTHENTIK_BOOTSTRAP_PASSWORD: "${AUTHENTIK_BOOTSTRAP_PASSWORD:?err}"
      AUTHENTIK_POSTGRESQL__HOST: "authentik-postgres"
      AUTHENTIK_POSTGRESQL__NAME: "${AUTHENTIK_POSTGRES_DB:?err}"
      AUTHENTIK_POSTGRESQL__PASSWORD: "${AUTHENTIK_POSTGRES_USER_PASSWORD:?err}"
      AUTHENTIK_POSTGRESQL__USER: "${AUTHENTIK_POSTGRES_USER:?err}"
      AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY:?err}"
    healthcheck:
      interval: "30s"
      retries: 5
      start_period: "90s"
      test:
        - "CMD-SHELL"
        - "ak healthcheck || exit 1"
      timeout: "10s"
    image: "authentik/server:${AUTHENTIK_VERSION:?err}"
    labels:
      wud.tag.include: "^\\d+\\.\\d+\\.\\d+$$"
      wud.watch: true
    networks:
      - "authentik"
    restart: "unless-stopped"
    security_opt:
      - "no-new-privileges:true"
    user: "root"
    volumes:
      - "${PWD}/services/authentik/blueprints/traefik.yaml:/blueprints/traefik.yaml:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "authentik-certs:/certs"
      - "authentik-media:/media"
      - "authentik-templates:/templates"
volumes:
  authentik-certs: null
  authentik-media: null
  authentik-postgres-data: null
  authentik-templates: null
