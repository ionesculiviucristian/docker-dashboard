networks:
  proxy:
    external: true
    name: "${PROXY_NETWORK:?err}"
services:
  cadvisor:
    devices:
      - "/dev/kmsg"
    image: "gcr.io/cadvisor/cadvisor:${CADVISOR_VERSION:?err}"
    labels:
      traefik.docker.network: "${PROXY_NETWORK:?err}"
      traefik.enable: true
      traefik.http.routers.cadvisor.entrypoints: "websecure"
      traefik.http.routers.cadvisor.middlewares: "authentik-server@docker"
      traefik.http.routers.cadvisor.rule: "Host(`${CADVISOR_HOST:?err}`)"
      traefik.http.routers.cadvisor.tls: true
      traefik.http.services.cadvisor.loadbalancer.server.port: "${CADVISOR_HOST_PORT:?err}"
      wud.tag.include: "^v\\d+\\.\\d+\\.\\d+$$"
      wud.watch: true
    networks:
      - "proxy"
    privileged: true
    restart: "unless-stopped"
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - "/:/rootfs:ro"
      - "/dev/disk/:/dev/disk:ro"
      - "/sys:/sys:ro"
      - "/var/lib/docker/:/var/lib/docker:ro"
      - "/var/run:/var/run:ro"
