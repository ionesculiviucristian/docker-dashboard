# yaml-language-server: $schema=../../schemas/service.schema.json
name: "What's up Docker?"
description: "Keep your containers up-to-date!"
url: "https://getwud.github.io/wud/#"
local_url: "https://whatsupdocker.services.local"
docker_hub_url: "https://hub.docker.com/r/getwud/wud"
dockerfile_url: "https://github.com/getwud/wud/blob/main/Dockerfile"

homepage:
  - name: "What's up Docker?"
    container: "{{HOMEPAGE_VAR_COMPOSE_PROJECT_NAME}}-whatsupdocker-1"
    description: "Keep your containers up-to-date!"
    href: "https://{{HOMEPAGE_VAR_WHATSUPDOCKER_HOSTNAME}}/"
    icon: "/icons/wud.svg"
    server: "my-docker"
    showStats: true
    widget:
      type: "whatsupdocker"
      url: "http://whatsupdocker:{{HOMEPAGE_VAR_WHATSUPDOCKER_PORT}}"
